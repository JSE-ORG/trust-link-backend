version: 2
updates:
  # ── npm ──────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Group production dependency minor and patch updates together
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Group dev dependency minor and patch updates together
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Major version npm updates remain as individual pull requests since they
    # require manual review for breaking changes. The open queue limit (10)
    # caps how many accumulate before Dependabot pauses.

  # ── GitHub Actions ────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      # Group all GitHub Actions minor and patch bumps into a single PR so a
      # batch of upstream pin updates doesn't fill the queue with eight
      # identical-looking two-line diffs. Major version bumps stay separate
      # since they typically contain breaking changes and need individual
      # review.
      github-actions-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # ── Security updates ─────────────────────────────────────────────────────────
  # Dependabot security updates run independently of the scheduled version
  # updates above and are configured per-ecosystem via the same `updates` list
  # using `labels` and lower-latency schedules. They only fire when a known
  # advisory exists, so they arrive promptly and separately from routine bumps.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "dependencies:security"
    commit-message:
      prefix: "security(deps)"
      include: "scope"
    # Security patches for the same CVE are grouped by advisory so the queue
    # stays readable. Remediation updates (e.g. upgrading a transitive dep
    # through a direct dep minor bump) remain grouped alongside their
    # counterpart in the weekly schedule — the security label is what
    # distinguishes them.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
      - "security"
      - "dependencies:security"
    commit-message:
      prefix: "security(ci)"
      include: "scope"
