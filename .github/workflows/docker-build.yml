name: Docker Build

on:
  pull_request:
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - src/**
      - .nvmrc
      - .github/workflows/docker-build.yml

# Cancel superseded builds for the same workflow + ref (#767).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents:read for checkout. actions:write is required for the GHA build
# cache (cache-from/cache-to type=gha). push: false, so no packages:write (#768).
permissions:
  contents: read
  actions: write

jobs:
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    # Recent builds finish in ~3 minutes; 20m matches test.yml headroom (#769).
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Issue #770: this workflow never runs `npm ci` on the runner — the image
      # is built entirely inside Docker. Node is pinned in the Dockerfile
      # (`FROM node:22-alpine`, matching `.nvmrc`). Adding setup-node + npm
      # cache here would install nothing useful on the runner.
      - name: Verify Dockerfile Node major matches .nvmrc
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          from_line="$(grep -E '^FROM node:' Dockerfile | head -1)"
          echo "Expected Node major from .nvmrc: $expected"
          echo "Dockerfile base: $from_line"
          echo "$from_line" | grep -E "node:${expected}([.-]|$)" 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          # Without `load`, buildx leaves the image in its own cache and never
          # hands it to the Docker daemon, so the verify step below fails with
          # "Unable to find image 'trust-link-backend:ci' locally".
          load: true
          tags: trust-link-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image starts and answers health check
        run: |
          docker run -d \
            --name trustlink-ci \
            -p 3000:3000 \
            -e NODE_ENV=test \
            -e DATABASE_URL=postgresql://trustlink:trustlink@localhost:5432/trustlink_test \
            -e SEP10_JWT_SECRET=test-jwt-secret-must-be-at-least-32-chars \
            -e SYSTEM_SIGNER_SECRET=SAIJDXETR5B7YFPH7SUOISWVBHHSI46JLYFDCWDMEV2L46XAHASPP35C \
            -e CONTRACT_ID=CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4 \
            -e ADMIN_ADDRESS=GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5 \
            -e STELLAR_NETWORK=TESTNET \
            trust-link-backend:ci
          echo "Waiting for container to start..."
          sleep 10
          docker inspect --format='{{.State.Status}}' trustlink-ci
          docker rm -f trustlink-ci
