name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  # Job id is `test` for history continuity. This job enforces the coverage
  # threshold only. Dependency auditing and licence compliance moved to
  # security-audit.yml, which runs on a schedule: a newly published advisory
  # is not caused by the pull request in front of it and must not block merges.
  test:
    name: Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trustlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Cache TypeScript build output
        uses: actions/cache@v4
        with:
          path: |
            dist
            tsconfig.build.tsbuildinfo
          key: ts-build-${{ runner.os }}-${{ hashFiles('tsconfig.build.json', 'src/**/*.ts') }}
          restore-keys: |
            ts-build-${{ runner.os }}-

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Check coverage threshold
        run: node scripts/check_coverage.js
