name: Database Migrations

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview migrations without applying (dry run)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# Do not cancel in-progress migrations for the same ref (#767). This job
# applies Prisma migrations against Postgres; aborting mid-deploy can leave
# the schema partially applied. Newer pushes still queue separately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only: migrations run against the ephemeral CI Postgres service (#768).
permissions:
  contents: read

jobs:
  migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    # Recent runs complete in ~1 minute; 10m leaves headroom without the
    # 360m GitHub default (#769).
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustlink
          POSTGRES_PASSWORD: trustlink
          POSTGRES_DB: trustlink_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trustlink:trustlink@localhost:5432/trustlink_db

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check pending migrations (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== DRY RUN: Listing pending migrations ==="
          npx prisma migrate status
          echo "=== No changes applied (dry run mode) ==="

      - name: Apply migrations
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status
