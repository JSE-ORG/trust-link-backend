name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs for the same workflow + ref (#767).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: lint and typecheck never write back to the repo (#768).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # prisma.config.ts reads DATABASE_URL at load, so `prisma generate` needs it
    # even though generation never connects.
    env:
      DATABASE_URL: postgresql://trustlink:trustlink@localhost:5432/trustlink_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Typed lint rules resolve types through @prisma/client. Without the
      # generated client every `prisma.x.update()` is an unresolved type and
      # the no-unsafe-* rules fire in their hundreds — 421 errors on this repo.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint:check
        env:
          ESLINT_USE_FLAT_CONFIG: 'true'

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://trustlink:trustlink@localhost:5432/trustlink_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run typecheck
        run: npm run typecheck
