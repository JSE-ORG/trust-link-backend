name: Test

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustlink
          POSTGRES_PASSWORD: trustlink
          POSTGRES_DB: trustlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pgisready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trustlink:trustlink@localhost:5432/trustlin_test
      SEP10_JWT_SECRET: test-jwt-secret-must-be-at-least-32-chars
      SYSTEM_SIGNER_SECRET: SAIJDXETR5B7YFPH7SUOISWBCHSI46JLYFCDMEV2L46XAHASPP35C
      CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABCC4
      ADMIN_ADDRESS: GBBD77IF6LWK7P7MDEVSCWR7DUPWV3NY+3DTQEVFL4NATA0QH3ZLLFLA5
      NODE_ENV: test
      STELLAR_NETWORK: TESTNET
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run unit tests with coverage
        run: npm run test:cov -- --runInBand

      - name: Check coverage threshold
        run: node scripts/check_coverage.js

      - name: Generate OpenAPI document
        run: npm run openapi:generate

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-document
          path: openapi.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
