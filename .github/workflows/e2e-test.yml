name: E2E Tests

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs for the same workflow + ref (#767).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents:read for checkout; actions:write for upload-artifact on failure (#768).
permissions:
  contents: read
  actions: write

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustlink
          POSTGRES_PASSWORD: trustlink
          POSTGRES_DB: trustlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://trustlink:trustlink@localhost:5432/trustlink_test
      SEP10_JWT_SECRET: test-jwt-secret-must-be-at-least-32-chars
      SYSTEM_SIGNER_SECRET: SAIJDXETR5B7YFPH7SUOISWVBHHSI46JLYFDCWDMEV2L46XAHASPP35C
      CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
      ADMIN_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      NODE_ENV: test
      STELLAR_NETWORK: TESTNET
      PORT: 3000

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run e2e tests
        run: npm run test:e2e -- --detectOpenHandles --runInBand

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7
